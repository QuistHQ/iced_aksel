[workspace]
members = ["iced_aksel", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
description = "A data-driven charting library for Iced"
authors = ["Mads Ahlquist Jensen <madsaj10@outlook.com>", "Dennis Mellquist"]
repository = "https://github.com/QuistHQ/iced_aksel"
license = "MIT"
readme = "README.md"
keywords = ["iced", "chart", "canvas"]
categories = ["gui"]
exclude = [
    "flake.nix",
    "flake.lock",
    ".github/*",
    "examples/*"
]

[workspace.lints.clippy]
inline_always = "allow"
perf = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
aksel = "0.2"
chrono = "0.4"
cpal = "0.17.0"
derive_more = { version = "2.0", features = ["from", "error", "display", "into"] }
derivative = "2.2"
earcutr = "0.5"
iced = { git = "https://github.com/iced-rs/iced.git", branch = "vello_cpu", features = ["tokio"] }
iced_core = { git = "https://github.com/iced-rs/iced.git", branch = "vello_cpu" }
iced_graphics = { git = "https://github.com/iced-rs/iced.git", branch = "vello_cpu", features = ["geometry"] }
iced_renderer = { git = "https://github.com/iced-rs/iced.git", branch = "vello_cpu", features = ["wgpu-bare", "vello-cpu", "geometry"] }
iced_wgpu = { git = "https://github.com/iced-rs/iced.git", branch = "vello_cpu" }
iced_vello_cpu = { git = "https://github.com/iced-rs/iced.git", branch = "vello_cpu" }
indexmap = "2.12"
lru = "0.16"
lyon_tessellation = "1.0"
lyon_path = "1.0"
lyon = "1.0"
rand = "0.9"
realfft = "3.5.0"
smallvec = "1.15"
strum = "0.27"
strum_macros = "0.27"
triple_buffer = "8.1.1"
rapidhash = "4.4"
paste = "1.0"
